<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <img src="IMG.png" alt="VetClinic">
      <p>Sistema de Gestión Veterinaria</p>
    </div>
    <div class="login-body">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input class="form-control" type="email" [(ngModel)]="correo" placeholder="Ingresa tu correo electrónico" (keyup.enter)="ingresar()">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div style="position:relative;">
          <input class="form-control" [type]="mostrarClave ? 'text' : 'password'" [(ngModel)]="contrasena" placeholder="••••••••" (keyup.enter)="ingresar()" style="padding-right:42px;">
          <button type="button" (click)="mostrarClave = !mostrarClave"
            [attr.aria-label]="mostrarClave ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [title]="mostrarClave ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:16px; line-height:1; padding:4px;">
            {{ mostrarClave ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>
      <div class="form-row-check">
        <label class="checkbox-row">
          <input type="checkbox"> Recordar sesión
        </label>
        <span class="forgot">¿Olvidaste tu contraseña?</span>
      </div>
      <button class="btn-login" (click)="ingresar()" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </div>
    <div class="login-footer">
      <p>© 2026 VetClinic · Todos los derechos reservados</p>
    </div>
  </div>
</div>
